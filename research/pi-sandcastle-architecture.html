<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pi + Sandcastle architecture</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #f5f5f5;
        --ink: #2d3142;
        --muted: #4f5d75;
        --soft: #7a8399;
        --rule: rgba(45, 49, 66, 0.12);
        --accent: #eb6c36;
        --accent-tint: rgba(235, 108, 54, 0.08);
        --link: #2e5aa8;
      }
      html,
      body {
        margin: 0;
        background: var(--paper);
      }
      svg {
        display: block;
        width: 100vw;
        height: auto;
      }
      .title {
        font-family: 'Instrument Serif', serif;
        font-size: 30px;
        font-weight: 400;
        fill: var(--ink);
      }
      .callout {
        font-family: 'Instrument Serif', serif;
        font-size: 14px;
        font-style: italic;
        fill: var(--soft);
      }
      .eyebrow {
        font-family: 'Geist Mono', monospace;
        font-size: 8px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        fill: var(--soft);
      }
      .label {
        font-family: 'Geist', sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: var(--ink);
      }
      .body {
        font-family: 'Geist', sans-serif;
        font-size: 10px;
        font-weight: 400;
        fill: var(--soft);
      }
      .mono {
        font-family: 'Geist Mono', monospace;
        font-size: 9px;
        font-weight: 400;
        fill: var(--soft);
      }
      .arrow-label {
        font-family: 'Geist Mono', monospace;
        font-size: 8px;
        font-weight: 400;
        letter-spacing: 0.06em;
        fill: var(--soft);
      }
      .zone {
        rx: 8;
        ry: 8;
        fill: rgba(45, 49, 66, 0.02);
        stroke: rgba(45, 49, 66, 0.10);
        stroke-width: 0.8;
      }
      .node {
        rx: 6;
        ry: 6;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1536 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
      <title id="title">Pi orchestrates Sandcastle execution inside an isolated sandbox</title>
      <desc id="desc">Architecture diagram showing Pi as the control plane, Sandcastle as the runner, and the sandboxed agent as the execution boundary with branch and session outputs returning to Pi.</desc>
      <defs>
        <marker id="arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" />
        </marker>
      </defs>

      <rect width="1536" height="900" fill="#f5f5f5" />

      <text x="72" y="78" class="title">Pi controls the run. Sandcastle isolates the run.</text>
      <text x="72" y="108" class="callout">Pi stays the brain; Sandcastle becomes the execution boundary.</text>

      <!-- Zones -->
      <rect x="64" y="160" width="404" height="640" class="zone" />
      <rect x="532" y="160" width="412" height="640" class="zone" />
      <rect x="1008" y="160" width="464" height="640" class="zone" />

      <rect x="188" y="164" width="144" height="16" fill="#f5f5f5" />
      <rect x="648" y="164" width="180" height="16" fill="#f5f5f5" />
      <rect x="1156" y="164" width="160" height="16" fill="#f5f5f5" />
      <text x="260" y="175" text-anchor="middle" class="eyebrow">PI CONTROL PLANE</text>
      <text x="738" y="175" text-anchor="middle" class="eyebrow">SANDCASTLE RUNTIME</text>
      <text x="1236" y="175" text-anchor="middle" class="eyebrow">ISOLATED SANDBOX</text>

      <!-- Left column -->
      <rect x="96" y="220" width="180" height="110" class="node" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" />
      <text x="116" y="248" class="eyebrow">INPUT</text>
      <text x="116" y="276" class="label">Task source</text>
      <text x="116" y="298" class="body">issue tracker • plan • worklog</text>
      <text x="116" y="318" class="mono">what should happen next?</text>

      <rect x="96" y="376" width="288" height="142" class="node" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2" />
      <text x="116" y="404" class="eyebrow">ORCHESTRATOR</text>
      <text x="116" y="434" class="label">Pi agent / worker control</text>
      <text x="116" y="456" class="body">pick tasks • launch workers • track state</text>
      <text x="116" y="478" class="body">plans • todos • hidden panes • handoffs</text>
      <text x="116" y="500" class="mono">decide → delegate → observe</text>

      <rect x="96" y="564" width="180" height="118" class="node" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
      <text x="116" y="592" class="eyebrow">HOST GIT</text>
      <text x="116" y="620" class="label">Repo + worktree</text>
      <text x="116" y="642" class="body">branches • commits • merge targets</text>
      <text x="116" y="664" class="mono">source of truth on host</text>

      <!-- Center column -->
      <rect x="566" y="242" width="284" height="128" class="node" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
      <text x="586" y="270" class="eyebrow">RUNTIME</text>
      <text x="586" y="298" class="label">Sandcastle runner</text>
      <text x="586" y="320" class="body">creates sandbox • runs agent • merges back</text>
      <text x="586" y="342" class="mono">execution substrate</text>

      <rect x="566" y="432" width="284" height="130" class="node" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" />
      <text x="586" y="460" class="eyebrow">PLUMBING</text>
      <text x="586" y="488" class="label">Branch + session management</text>
      <text x="586" y="510" class="body">worktree setup • resume • fork • cleanup</text>
      <text x="586" y="532" class="body">stdout and commits flow back to Pi</text>

      <rect x="566" y="620" width="284" height="104" class="node" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2" />
      <text x="586" y="648" class="eyebrow">PRIMARY LOOP</text>
      <text x="586" y="676" class="label">Pi asks → Sandcastle runs → Pi reviews</text>
      <text x="586" y="698" class="body">the runner is the boundary; Pi stays in charge</text>

      <!-- Right column -->
      <rect x="1040" y="222" width="360" height="112" class="node" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
      <text x="1060" y="250" class="eyebrow">SANDBOX PROVIDER</text>
      <text x="1060" y="278" class="label">Docker / Podman / Vercel / custom</text>
      <text x="1060" y="300" class="body">isolated environment for the agent</text>
      <text x="1060" y="322" class="mono">mount / sync / exec</text>

      <rect x="1040" y="378" width="360" height="156" class="node" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
      <text x="1060" y="406" class="eyebrow">AGENT</text>
      <text x="1060" y="434" class="label">Coding agent inside sandbox</text>
      <text x="1060" y="456" class="body">reads prompt • edits files • tests • commits</text>
      <text x="1060" y="478" class="body">session can be resumed or forked</text>
      <text x="1060" y="500" class="mono">Claude / Codex / Pi / other</text>

      <rect x="1040" y="580" width="360" height="116" class="node" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" />
      <text x="1060" y="608" class="eyebrow">OUTPUTS</text>
      <text x="1060" y="636" class="label">Diffs • commits • stdout • session ids</text>
      <text x="1060" y="658" class="body">returned to Pi for review / follow-up</text>
      <text x="1060" y="680" class="mono">what the control plane consumes</text>

      <!-- Connectors -->
      <path d="M 276 275 H 332 Q 340 275 340 283 V 376" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-muted)" />
      <text x="292" y="262" class="arrow-label">task / intent</text>

      <path d="M 384 442 H 470 Q 478 442 478 450 V 292 Q 478 284 486 284 H 566" fill="none" stroke="#eb6c36" stroke-width="1.3" marker-end="url(#arrow-accent)" />
      <text x="430" y="430" class="arrow-label" fill="#eb6c36">run()</text>

      <path d="M 850 292 H 922 Q 930 292 930 300 V 278 H 1040" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)" />
      <text x="884" y="280" class="arrow-label" fill="#2e5aa8">launch / mount / sync</text>

      <path d="M 1220 334 V 352 Q 1220 360 1212 360 H 850" fill="none" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#arrow-muted)" />
      <text x="1184" y="352" class="arrow-label">stdout / commits / session</text>

      <path d="M 566 494 H 500 Q 492 494 492 486 V 430" fill="none" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#arrow-muted)" />
      <text x="394" y="480" class="arrow-label">status / progress</text>

      <path d="M 276 618 H 350 Q 358 618 358 626 V 650 H 566" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#arrow-muted)" />
      <text x="308" y="606" class="arrow-label">branch / worktree state</text>

      <path d="M 850 516 H 948 Q 956 516 956 508 V 444 H 1040" fill="none" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#arrow-muted)" />
      <text x="888" y="504" class="arrow-label">resume / fork / cleanup</text>

      <text x="72" y="862" class="callout">Best fit: Pi stays the brain, Sandcastle-like runtime handles the isolated agent execution, and the host keeps the git truth.</text>
    </svg>
  </body>
</html>
