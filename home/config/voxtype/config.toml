# Voxtype: local Parakeet dictation controlled by Hyprland.
engine = "parakeet"
state_file = "auto"

[hotkey]
enabled = false

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 3600
pause_media = false

[parakeet]
# Quantized TDT v3 is optimized for fast CPU inference and includes punctuation.
model = "parakeet-tdt-0.6b-v3-int8"
model_type = "tdt"
on_demand_loading = false

[output]
# Paste mode is much faster than key-by-key typing for long transcriptions.
# restore_clipboard puts the previous clipboard back after the paste keystroke.
mode = "paste"
# Kitty handles Ctrl+Shift+V as clipboard paste, avoiding Vim's Ctrl+V literal-next command.
paste_keys = "ctrl+shift+v"
fallback_to_clipboard = true
type_delay_ms = 0
pre_type_delay_ms = 0
auto_submit = true
restore_clipboard = true
restore_clipboard_delay_ms = 500

[output.notification]
on_recording_start = false
on_recording_stop = false
on_transcription = false

[osd]
enabled = true
frontend = "quickshell"
style = "default"
palette = "fallback"
layout = "minimal"

[status]
icon_theme = "minimal"
