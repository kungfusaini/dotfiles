# Voxtype: local Parakeet dictation controlled by Hyprland.
engine = "parakeet"
state_file = "auto"

[hotkey]
enabled = false

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 60

[parakeet]
# Quantized TDT v3 is optimized for fast CPU inference and includes punctuation.
model = "parakeet-tdt-0.6b-v3-int8"
model_type = "tdt"
on_demand_loading = false

[output]
mode = "type"
fallback_to_clipboard = false
type_delay_ms = 0
pre_type_delay_ms = 0
auto_submit = true

[output.notification]
on_recording_start = false
on_recording_stop = false
on_transcription = false

[osd]
enabled = true
frontend = "quickshell"
style = "default"
palette = "fallback"
layout = "minimal"

[status]
icon_theme = "minimal"
