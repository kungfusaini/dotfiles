# Kitty touch/touchscreen scrolling
# Smooth sub-line scrolling in kitty's own scrollback
pixel_scroll yes

# Touchscreen/touchpad scroll speed; increase if too slow, use negative to reverse
touch_scroll_multiplier 1.0

# Inertial/momentum scrolling; requires full kitty restart after changing
momentum_scroll 0.96

# Keep enough scrollback to scroll through
scrollback_lines 10000
