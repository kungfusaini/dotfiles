<!doctype html>
<meta charset="utf-8">
<title>Pair tablet media</title>
<style>
  body { background:#142a38; color:#eef5f2; font:18px sans-serif; margin:40px; }
  button { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:280px; height:80px; border:0; border-radius:16px; background:#26cf87; color:#142a38; font-size:18px; }
</style>
<h1>Pair this tablet window</h1>
<p>Only the registered tablet window can be paired. No other browser window will be paused.</p>
<button id="pair">Pair this window</button>
<p id="status" role="status"></p>
<script src="pair.js"></script>
