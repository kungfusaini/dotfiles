id = "sumeet.pi-workspace-sync"
name = "Pi Workspace Sync"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Durably reconcile Herdr spaces with Pi projects through a shared XDG registry."
platforms = ["macos", "linux"]

[[startup]]
command = ["node", "sync.mjs", "startup"]

[[events]]
on = "pane.closed"
command = ["node", "sync.mjs", "event"]

[[events]]
on = "tab.closed"
command = ["node", "sync.mjs", "event"]

[[events]]
on = "tab.created"
command = ["node", "sync.mjs", "event"]

[[events]]
on = "tab.renamed"
command = ["node", "sync.mjs", "event"]

[[events]]
on = "tab.focused"
command = ["node", "sync.mjs", "event"]

[[actions]]
id = "sync"
title = "Sync Pi projects and Herdr spaces"
contexts = ["workspace"]
command = ["node", "sync.mjs", "action"]
