"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_purple)\
${custom.userhost}\
[](bg:color_blue fg:color_purple)\
$directory\
[](bg:color_aqua fg:color_blue)\
$git_branch\
$git_status\
[](bg:color_green fg:color_aqua)\
$python\
[](bg:color_yellow fg:color_green)\
[](bg:color_orange fg:color_yellow)\
[](color_orange)\
$line_break$character"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[custom.userhost]
command = 'echo "$(whoami)@$(scutil --get ComputerName)"'
when = true
style = "fg:color_fg0 bg:color_purple"

[directory]
style = "fg:color_fg0 bg:color_blue"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:color_aqua"
format = '[[ $symbol $branch ](fg:color_fg0 bg:color_aqua)]($style)'

[git_status]
style = "bg:color_aqua"
format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_aqua)]($style)'

[python]
format = '[(  $virtualenv )]($style)'
style = 'fg:color_fg0 bg:color_green'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_green)'
error_symbol = '[](bold fg:color_red)'
vimcmd_symbol = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol = '[](bold fg:color_purple)'
vimcmd_visual_symbol = '[](bold fg:color_yellow)'
