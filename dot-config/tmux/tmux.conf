run-shell 'if command -v brew >/dev/null 2>&1 && tpm_prefix=$(brew --prefix tpm 2>/dev/null) && [ -x "$tpm_prefix/share/tpm/tpm" ]; then "$tpm_prefix/share/tpm/tpm"; elif [ -x "${XDG_DATA_HOME:-$HOME/.local/share}/tmux/plugins/tpm/tpm" ]; then "${XDG_DATA_HOME:-$HOME/.local/share}/tmux/plugins/tpm/tpm"; elif [ -x "$HOME/.tmux/plugins/tpm/tpm" ]; then "$HOME/.tmux/plugins/tpm/tpm"; fi'

source-file "$XDG_CONFIG_HOME/tmux/conf/hooks.conf"
source-file "$XDG_CONFIG_HOME/tmux/conf/keybindings.conf"
source-file "$XDG_CONFIG_HOME/tmux/conf/statusbar.conf"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'egel/tmux-gruvbox'
set -g @plugin 'mrjones2014/smart-splits.nvim'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'schasse/tmux-jump'

# For scrolling
set -g mouse on

# For copying
set -g set-clipboard on
set -g allow-passthrough on
set -g focus-events on
# Theme
set -g @tmux-gruvbox 'dark'
set -g pane-active-border-style "bg=default,fg=colour166"
set -g pane-border-style "bg=default,fg=colour245"
set -g pane-border-lines "heavy"

set -gq allow-passthrough on
set -g extended-keys on
